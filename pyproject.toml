[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-management-system"
version = "0.1.0"
description = "AI-assisted mini lead management system: lead store + API, duplicate detection, source extraction"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Only needed to run the LLM escalation tier against the live API.
# The system is fully functional without it (see README: "Behaviour without credentials").
llm = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
leads-load = "app.loader:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Intentionally no `-W error`: promoting DeprecationWarning to an error makes the suite fail
# on unrelated upstream deprecations (starlette/anyio), which would break a fresh install for
# no benefit here.
